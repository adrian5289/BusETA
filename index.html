<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#34599a" />
<title>九巴到站時間</title>

<link rel="apple-touch-icon" href="BUS.jpg" />
<link rel="icon" href="BUS.jpg" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="九巴到站" />

<style>
  :root{
    --bg:#e6ebf4; --card:#ffffff; --line:#e5e5ea; --chip:#e5e5ea;
    --text:#3a3a3c; --sub:#6e6e73; --dim:#8e8e93;
    --accent:#34599a; --accent-soft:#e3eaf5;
    --red:#d70015; --orange:#c93400; --green:#248a3d;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  }
  header{
    position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
    border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(52,89,154,.25);
  }
  .wrap{max-width:32rem;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
  .top-r{display:flex;align-items:center;gap:10px}
  .clock{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.8)}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:17px;cursor:pointer}
  .icon-btn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.icon-btn.spin{animation:none;opacity:.6}}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .tab{
    border:0;border-radius:12px;padding:9px 4px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .tab .e{font-size:18px;line-height:1.1}
  .tab[aria-selected="true"]{background:#fff;color:var(--accent)}
  .icon-btn:focus-visible,.tab:focus-visible,.eta-row.tap:focus-visible,.x-btn:focus-visible{outline:2px solid #ffb000;outline-offset:2px}

  #ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub)}
  main{padding:16px 16px 0}
  .stop{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(52,89,154,.08)}
  .stop-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
  .stop-name{font-size:19px;font-weight:700}
  .stop-code{font-size:12px;color:var(--dim)}
  .buffer{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .stale .route{opacity:.55}

  .route{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .route:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .route-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .rno{border:1.5px solid var(--accent);color:var(--accent);border-radius:7px;padding:2px 8px;font-weight:700;font-size:15px}
  .dest{font-size:14px;color:var(--sub)}

  .eta-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
  .eta-row.tap{cursor:pointer;border-radius:10px;margin:0 -8px;padding:7px 8px}
  .eta-row.tap:active{background:var(--chip)}
  .eta-row.open{background:var(--accent-soft)}
  .when{display:flex;flex-direction:column;gap:2px}
  .arr{font-size:16px;font-variant-numeric:tabular-nums}
  .arr small{font-size:12px;color:var(--dim);margin-left:4px}
  .arr .rmk{color:var(--dim);font-size:12px;margin-left:6px}
  .leave{font-size:13px;color:var(--sub)}
  .leave.late{color:var(--red)}
  .mins{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .mins small{font-size:12px;font-weight:500;margin-left:2px}
  .red{color:var(--red)} .orange{color:var(--orange)} .green{color:var(--green)}
  .none{font-size:14px;color:var(--dim);padding:4px 0}
  .none.rmk-only{color:var(--orange)}
  .warn{font-size:13px;color:var(--orange);background:#fff4e5;padding:9px 11px;border-radius:10px;margin-bottom:10px}
  .err{font-size:13px;color:var(--red);background:#fdecee;padding:9px 11px;border-radius:10px}
  .upd{font-size:12px;color:var(--dim);text-align:right;margin-top:6px}

  .sel-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:7px 8px;margin:0 -8px}
  .x-btn{border:0;background:none;color:var(--accent);font-size:15px;cursor:pointer;padding:2px 6px}
  .xfer{background:#f4f6fb;border:1px solid var(--accent-soft);border-radius:14px;padding:12px;margin:4px 0 8px}
  .xpt{padding:6px 0}
  .xpt+.xpt{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
  .xpt-h{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:4px}
  .xpt-h span{font-weight:400;color:var(--sub);font-size:13px}
  .xpt-h .walk{text-align:right;line-height:1.4}
  .conn{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
  .conn .wait{font-size:12px;color:var(--sub);margin-left:8px}
  .xmsg{font-size:13px;color:var(--dim);padding:2px 0}
  .foot{text-align:center;font-size:12px;color:var(--dim);padding-top:4px}
  .leave b{font-weight:600}
  .rno.tag{font-size:12px;padding:0 5px;border-width:1.2px;border-radius:6px;margin-right:7px;vertical-align:2px}
  .bell{font-size:12px;color:var(--accent);margin-left:6px}
  .alarm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:600;color:var(--orange);background:#fff4e5;border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .demo{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#6b3fa0;background:#f1e8fb;border-radius:12px;padding:9px 12px;margin-bottom:14px}
  .demo button{border:0;border-radius:999px;background:#6b3fa0;color:#fff;font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
  #ver{cursor:pointer}
  .shift-btn{display:block;width:100%;border:0;border-radius:14px;background:var(--card);color:var(--accent);font:inherit;font-size:15px;font-weight:600;padding:12px;margin-bottom:14px;box-shadow:0 2px 10px rgba(52,89,154,.08);cursor:pointer}
  .shift-on{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:0 2px 10px rgba(52,89,154,.08);font-size:14px}
  .shift-on .txt{flex:1;line-height:1.4}
  .shift-on .sub{display:block;font-size:12px;color:var(--sub)}
  .shift-on button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;font:inherit;font-size:13px;padding:6px 10px;cursor:pointer}
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:32rem;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .sheet h2{margin:0 0 4px;font-size:18px}
  .sheet p{margin:0 0 12px;font-size:13px;color:var(--sub)}
  .shift-opt{display:flex;align-items:center;width:100%;gap:12px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--text);font:inherit;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left}
  .shift-opt b{min-width:44px;font-size:18px;color:var(--accent)}
  .shift-opt .when{flex:1;font-size:14px}
  .shift-opt .ntf{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
  .sheet .cancel{width:100%;border:0;background:none;color:var(--sub);font:inherit;font-size:15px;padding:10px;cursor:pointer}
  .alarm button{border:0;border-radius:999px;background:var(--orange);color:#fff;font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>九巴到站時間</h1>
      <div class="top-r">
        <span class="clock" id="clock">--:--</span>
        <button class="icon-btn" id="refresh" aria-label="重新整理">↻</button>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>
<div id="ptr"></div>
<main class="wrap">
  <div id="content"></div>
  <div class="foot">數據來源：KMB / LWB 開放數據、港鐵開放數據<br><span id="ver"></span></div>
</main>

<script>
(function(){
'use strict';

/* ================= 設定 ================= */
var VERSION       = 'v2.11.4';   // 每次改版記得更新
var PUSH_API      = 'https://kmb-eta-push.adrian5289.workers.dev';   // 出門提醒推送伺服器 (Cloudflare Worker) 網址,例如 https://kmb-eta-push.xxx.workers.dev;留空 = 只喺網頁開住時提醒
var REFRESH_MS    = 30000;
var FETCH_TIMEOUT = 8000;
var FETCH_TRIES   = 2;
var STALE_MS      = 90000;
var TIGHT_MIN     = 3;    // 轉車相差 0–3 分鐘 = 好趕
var AEL_RIDE_MIN  = 14;   // 機場站去青衣站(找唔到實時資料時用)
var AEL_WALK_MIN  = 8;    // 青衣月台行去 68E 車站

var KMB = 'https://data.etabus.gov.hk/v1/transport/kmb/';
var MTR = 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=AEL&sta=';

// 已知站點 ID;其餘會由九巴站點清單用站牌編號自動對返
var KNOWN = {
  YL292:'C187E3771B7032EC', YL244:'21DA1E33BF580B96', YL242:'6A4B371546D489BF',
  YL255:'8BE58FAD7E9C94C7'
};

var TABS = [
  { id:'out', e:'🚪', name:'出門', cards:[
    { code:'YL292', name:'馬田壆', buffer:10, routes:[{r:'68E',hint:'青衣站'},{r:'68F',hint:'元朗公園(循環線)'}] } ] },
  { id:'yl', e:'🏡', name:'元朗回家', cards:[
    { code:'YL244', name:'YOHO MIX', routes:[{r:'68E',hint:'元朗公園'},{r:'68F',hint:'元朗公園(循環線)'}] },
    { code:'YL242', name:'YOHO I',   routes:[{r:'68E',hint:'元朗公園'},{r:'68F',hint:'元朗公園(循環線)'}] } ] },
  { id:'seph', e:'💄', name:'Sephora', cards:[
    { code:'YL369', name:'同樂街', arrive:true, routes:[{r:'968',hint:'銅鑼灣'}] },
    { code:'YL392', name:'YOHO II', arrive:true, routes:[{r:'968',hint:'銅鑼灣'}] } ] },
  { id:'sephb', e:'🌃', name:'Sephora回家', cards:[
    { code:'CW767', name:'永吉街', xfer:'968', routes:[{r:'968',hint:'元朗'}] },
    { code:'YL236', name:'大欖隧道轉車站', routes:[{r:'68E',hint:'元朗公園'}] },
    { code:'YL244', name:'YOHO MIX', routes:[{r:'68E',hint:'元朗公園'},{r:'68F',hint:'元朗公園(循環線)'}] } ] },
  { id:'air', e:'✈️', name:'機場', cards:[
    { code:'YL255', name:'康樂路', buffer:20, routes:[{r:'E36',hint:'機場(地面運輸中心)'},{r:'E36S',hint:'機場(地面運輸中心)'},{r:'A36',hint:'機場(地面運輸中心)'}] } ] },
  { id:'aph', e:'🚆', name:'機場回家', cards:[
    { kind:'ael', name:'機場站', sub:'港鐵機場快綫' },
    { code:'TY928', name:'青衣', routes:[{r:'68E',hint:'元朗公園'}] } ] }
];

// 968 轉車點;mins = 由永吉街(CW767)開出計嘅車程,跟九巴 app 嘅預計車程
// (九巴每站只列最近 3 班,中途係公路冇站,跟實時資料會撞錯前面嗰班車)
var XFER968 = [
  { name:'大欖隧道轉車站', near:'YL236', routes:['68E'],       mins:33 },
  { name:'YOHO MIX',       near:'YL244', routes:['68E','68F'], mins:42 }
];

/* ================= 狀態 ================= */
var stops = null;          // code -> {id, lat, lng}
var stopById = {};         // id -> {lat, lng}
var eta = {};              // code -> {data, lastOk, error, loading}
var mtr = {};              // 'AIR' / 'TSY' -> {times, lastOk, error}
var r968 = { ctx:null, map:null, lastOk:null, error:false };
var active = load('tab') || 'out';
var sel968 = load('sel968');
var selAEL = load('selAEL');
var reminder = load('reminder');   // {code, route, t, buf, fired}

// Sephora 返工更:早 15 分鐘到,預 1 小時 15 分鐘車程(連行去巴士站)
var SHIFTS = [
  { id:'B',   start:'11:00' },
  { id:'C',   start:'12:00' },
  { id:'C15', start:'12:15' },
  { id:'E',   start:'13:00' },
  { id:'E15', start:'13:15' }
];
var SHIFT_EARLY = 15, SHIFT_TRAVEL = 75;
var shiftAlarm = load('shiftAlarm');   // {id, start, at, serverId, push, fired}
var shiftPicker = false;
var refreshing = false, again = false, timers = {};

/* ================= 工具 ================= */
function load(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function normDest(s){ return s ? String(s).replace(/[()（）\s]/g,'').replace(/循環線/g,'') : ''; }
function hm(ms){ return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function minsTo(ms){ return Math.round((ms - Date.now())/60000); }
function colorFor(m){ return m<=3 ? 'red' : m<=8 ? 'orange' : 'green'; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function stopId(code){ return KNOWN[code] || (stops && stops[code] && stops[code].id) || null; }
function tabById(id){ return TABS.filter(function(t){ return t.id===id; })[0] || TABS[0]; }

/* ================= 預覽模式(模擬班次,用嚟夜晚測試) ================= */
var DEMO = /[?&]demo\b/.test(location.search) || load('demo') === true;
var DEMO_BASE = Date.now();
function demoData(url){
  var hkStr = function(t){ return new Date(t + 8*3600e3).toISOString().replace('T',' ').slice(0,19); };
  var m = /stop-eta\/(\w+)/.exec(url);
  if(m){
    var data = [];
    TABS.forEach(function(tb){ tb.cards.forEach(function(c){
      if(!c.code || stopId(c.code) !== m[1]) return;
      c.routes.forEach(function(r, i){
        [12, 25, 41].forEach(function(off){
          data.push({ route:r.r, dir:'O', dest_tc:r.hint, eta:new Date(DEMO_BASE + (off + i*4)*60000).toISOString(), rmk_tc:'' });
        });
      });
    }); });
    return { data:data };
  }
  var a = /getSchedule.*sta=(\w+)/.exec(url);
  if(a){
    var offs = a[1]==='AIR' ? [4, 14, 24] : [18, 28, 38], d = {};
    d['AEL-' + a[1]] = { DOWN: offs.map(function(o){ return { dest:'HOK', time:hkStr(DEMO_BASE + o*60000) }; }) };
    return { data:d };
  }
  return null;
}
function setDemo(on){ save('demo', on ? true : null); location.href = location.pathname + (on ? '?demo' : ''); }

async function fetchJson(url){
  if(DEMO){ var fake = demoData(url); if(fake) return fake; }
  var lastErr;
  for(var i=0;i<FETCH_TRIES;i++){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, FETCH_TIMEOUT);
    try{
      var res = await fetch(url, { signal:ctrl.signal, cache:'no-store' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){ lastErr = e; if(i<FETCH_TRIES-1) await sleep(800); }
    finally{ clearTimeout(t); }
  }
  throw lastErr;
}

/* ================= 站點清單(每星期更新一次) ================= */
async function ensureStops(){
  if(stops) return;
  save('kmbStops', null);   // 舊版快取(冇站名)
  var cached = load('kmbStops2');
  if(cached && Date.now() - cached.ts < 7*864e5){ buildStops(cached.rows); return; }
  try{
    var json = await fetchJson(KMB + 'stop');
    var rows = [];
    (json.data||[]).forEach(function(s){
      var m = /\(([A-Z]{2}\d{3}[a-z]?)\)/.exec(s.name_tc || '') || /\(([A-Z]{2}\d{3}[a-z]?)\)/.exec(s.name_en || '');
      rows.push([s.stop, m ? m[1] : '', +s.lat, +s.long, s.name_tc || '']);
    });
    save('kmbStops2', { ts:Date.now(), rows:rows });
    buildStops(rows);
  }catch(e){
    if(cached) buildStops(cached.rows);
  }
}
function buildStops(rows){
  stops = {};
  rows.forEach(function(r){
    stopById[r[0]] = { lat:r[2], lng:r[3], name:r[4] || '' };
    if(r[1] && !stops[r[1]]) stops[r[1]] = { id:r[0], lat:r[2], lng:r[3] };
  });
}

/* ================= 九巴到站 ================= */
async function loadEta(code){
  var id = stopId(code);
  var st = eta[code] || (eta[code] = { data:[], lastOk:null, error:false });
  if(!id){ st.error = !!stops; st.noId = !!stops; return; }
  try{
    var json = await fetchJson(KMB + 'stop-eta/' + id);
    st.data = json.data || []; st.lastOk = Date.now(); st.error = false;
  }catch(e){ st.error = true; }
}

/* ================= 968 路線(轉車用) ================= */
async function ensure968Ctx(){
  if(r968.ctx || !stops) return;
  var boardId = stopId('CW767');
  if(!boardId) return;
  var cached = load('r968ctx');
  if(cached && cached.boardId===boardId && Date.now()-cached.ts < 864e5){ r968.ctx = cached; return; }
  var bounds = [['inbound','I'],['outbound','O']];
  for(var i=0;i<bounds.length;i++){
    try{
      var json = await fetchJson(KMB + 'route-stop/968/' + bounds[i][0] + '/1');
      var list = (json.data||[]).map(function(d){ return { seq:+d.seq, id:d.stop }; }).sort(function(a,b){ return a.seq-b.seq; });
      var board = list.filter(function(s){ return s.id===boardId; })[0];
      if(!board) continue;
      var targets = {};
      XFER968.forEach(function(x){
        var ref = stops[x.near] || (KNOWN[x.near] && stopById[KNOWN[x.near]]);
        if(!ref) return;
        var best = null, bestD = Infinity;
        list.forEach(function(s){
          if(s.seq <= board.seq) return;
          var p = stopById[s.id]; if(!p) return;
          var d = Math.pow(p.lat-ref.lat,2) + Math.pow((p.lng-ref.lng)*0.92,2);
          if(d < bestD){ bestD = d; best = s.seq; }
        });
        if(best!=null && bestD < 1e-5) targets[x.near] = best;   // 約 300 米內先當係同一個轉車點
      });
      r968.ctx = { ts:Date.now(), boardId:boardId, dir:bounds[i][1], boardSeq:board.seq, lastSeq:list[list.length-1].seq, targets:targets };
      save('r968ctx', r968.ctx);
      return;
    }catch(e){}
  }
}

async function load968Eta(){
  if(!r968.ctx) return;
  try{
    var json = await fetchJson(KMB + 'route-eta/968/1');
    var map = {};
    (json.data||[]).forEach(function(d){
      if(d.dir !== r968.ctx.dir || !d.eta) return;
      var t = new Date(d.eta).getTime();
      (map[d.seq] = map[d.seq] || []).push(t);
    });
    Object.keys(map).forEach(function(k){ map[k].sort(function(a,b){ return a-b; }); });
    r968.map = map; r968.lastOk = Date.now(); r968.error = false;
    if(sel968 && !sel968.seq) sel968.seq = r968.ctx.boardSeq;
    track968();
  }catch(e){ r968.error = true; }
}

// 由某站某時間,一站一站推算同一架車去到目標站嘅時間(巴士唔會互相超越)
function chain(fromSeq, fromEta, toSeq, map){
  map = map || r968.map;
  var cur = fromEta;
  for(var s=fromSeq+1; s<=toSeq; s++){
    var list = map[s];
    if(!list) continue;
    var next = list.filter(function(t){ return t >= cur - 60000; })[0];
    if(next==null) return null;
    cur = next;
  }
  return cur;
}

// 跟住揀咗嗰架車,更新佢而家去到邊
function track968(){
  if(!sel968 || !r968.map) return;
  var c = r968.ctx, s = sel968.seq;
  var here = (r968.map[s]||[]).filter(function(t){ return Math.abs(t - sel968.eta) <= 4*60000; })
    .sort(function(a,b){ return Math.abs(a-sel968.eta) - Math.abs(b-sel968.eta); })[0];
  if(here!=null){
    sel968.eta = here;
    if(s === c.boardSeq) sel968.board = here;
  }else{
    var found = false;
    for(var n=s+1; n<=c.lastSeq; n++){
      var t = (r968.map[n]||[]).filter(function(x){ return x >= sel968.eta - 60000; })[0];
      if(t!=null){ sel968.seq = n; sel968.eta = t; found = true; break; }
    }
    if(!found && Date.now() - sel968.eta > 30*60000) sel968 = null;
  }
  save('sel968', sel968);
}

/* ================= 968 到達時間(Sephora:去怡和大廈) ================= */
var ARRIVE = { route:'968', name:'怡和大廈', match:/怡和大廈/ };
var arr = { ctx:null, map:null, failed:false };
var selArr = load('selArr');   // {code, t}

async function ensureArriveCtx(){
  if(arr.ctx || !stops) return;
  var cached = load('arrCtx');
  if(cached && Date.now() - cached.ts < 864e5){ arr.ctx = cached; return; }
  var codes = TABS.reduce(function(a, tb){ return a.concat(tb.cards.filter(function(c){ return c.arrive; }).map(function(c){ return c.code; })); }, []);
  var bounds = [['outbound','O'],['inbound','I']];
  for(var i=0;i<bounds.length;i++){
    try{
      var json = await fetchJson(KMB + 'route-stop/' + ARRIVE.route + '/' + bounds[i][0] + '/1');
      var list = (json.data||[]).map(function(d){ return { seq:+d.seq, id:d.stop }; });
      var seqs = {};
      codes.forEach(function(c){ var id = stopId(c); list.forEach(function(x){ if(x.id===id) seqs[c] = x.seq; }); });
      if(!Object.keys(seqs).length) continue;
      var target = list.filter(function(x){ return ARRIVE.match.test((stopById[x.id]||{}).name || ''); })[0];
      arr.ctx = { ts:Date.now(), dir:bounds[i][1], seqs:seqs, targetSeq:target ? target.seq : null };
      if(target) save('arrCtx', arr.ctx);
      return;
    }catch(e){}
  }
  arr.failed = true;
}

async function loadArriveEta(){
  if(!arr.ctx) return;
  try{
    var json = await fetchJson(KMB + 'route-eta/' + ARRIVE.route + '/1');
    var map = {};
    (json.data||[]).forEach(function(d){
      if(d.dir !== arr.ctx.dir || !d.eta) return;
      (map[d.seq] = map[d.seq] || []).push(new Date(d.eta).getTime());
    });
    Object.keys(map).forEach(function(k){ map[k].sort(function(a,b){ return a-b; }); });
    arr.map = map;
  }catch(e){}
}

// 揀咗嗰班車:跟住九巴更新時間;車走咗就取消
function trackArrive(){
  if(!selArr) return;
  var st = eta[selArr.code];
  if(st && st.lastOk){
    var near = st.data.filter(function(d){ return d.route===ARRIVE.route && d.eta; })
      .map(function(d){ return new Date(d.eta).getTime(); })
      .filter(function(t){ return Math.abs(t - selArr.t) <= 4*60000; })
      .sort(function(a,b){ return Math.abs(a-selArr.t) - Math.abs(b-selArr.t); })[0];
    if(near!=null) selArr.t = near;
  }
  if(Date.now() > selArr.t + 2*60000) selArr = null;
  save('selArr', selArr);
}

// 一站一站跟住同一架車推算;跟唔到(九巴每站只列最近 3 班)就逐段計車程再加埋
function arriveAt(code, t){
  var c = arr.ctx, from = c && c.seqs[code];
  if(from==null || c.targetSeq==null || c.targetSeq <= from || !arr.map) return null;
  var a = chain(from, t, c.targetSeq, arr.map);
  if(a!=null) return { t:a, exact:true };
  var travel = segmentTravel(from, c.targetSeq, arr.map);
  return travel==null ? null : { t:t + travel, exact:false };
}
// 每兩個相鄰站:用最快到前一站嗰架車,量佢去下一站要幾耐,全部加埋
function segmentTravel(from, to, map){
  var total = 0, prev = null;
  for(var s=from; s<=to; s++){
    var list = map[s]; if(!list || !list.length) continue;
    if(prev!=null){
      var a = map[prev][0];
      var b = list.filter(function(x){ return x >= a - 60000; })[0];
      if(b==null) return null;
      total += b - a;
    }
    prev = s;
  }
  return prev===null ? null : total;
}

function panelArrive(code, t){
  var h = '<div class="xfer"><div class="xpt">', c = arr.ctx;
  var msg = function(m){ return h + '<div class="xpt-h">' + ARRIVE.name + '</div><div class="xmsg">' + m + '</div></div></div>'; };
  if(!c) return msg(arr.failed ? '暫時計唔到,請稍後再試' : '計緊到達時間...');
  if(c.targetSeq==null) return msg(ARRIVE.route + ' 路線搵唔到' + ARRIVE.name + '站');
  if(!arr.map) return msg('計緊到達時間...');
  var a = arriveAt(code, t);
  if(!a) return msg('暫時計唔到,車行近啲再試');
  return h + '<div class="xpt-h">' + ARRIVE.name + '<span>' + ARRIVE.route + ' 約 ' + hm(a.t) + ' 到</span></div></div></div>';
}

/* ================= 港鐵機場快綫 ================= */
async function loadMtr(sta){
  var st = mtr[sta] || (mtr[sta] = { times:[], lastOk:null, error:false });
  try{
    var json = await fetchJson(MTR + sta);
    var d = (json.data||{})['AEL-' + sta] || {};
    var all = (d.UP||[]).concat(d.DOWN||[]);
    st.times = all.filter(function(x){ return x.dest === 'HOK' && x.time; })
      .map(function(x){ return new Date(x.time.replace(' ','T') + '+08:00').getTime(); })
      .sort(function(a,b){ return a-b; });
    st.lastOk = Date.now(); st.error = false;
  }catch(e){ st.error = true; }
}

// 機場開出 → 青衣到站:按次序逐班配對,每個青衣到站時間只畀一班車用
// (港鐵每站只列最近幾班,後面嗰班未出現時唔可以借用前一班嘅時間)
var AEL_MIN_RIDE = 10;
function tsyFor(airT, air, tsy){
  var last = -Infinity, res = null;
  tsy = tsy.slice().sort(function(x,y){ return x-y; });
  air.slice().sort(function(x,y){ return x-y; }).forEach(function(a){
    if(a > airT + 1000) return;
    var t = tsy.filter(function(x){ return x > last && x >= a + AEL_MIN_RIDE*60000 && x <= a + 22*60000; })[0];
    if(t!=null) last = t;
    if(Math.abs(a - airT) <= 1000) res = t!=null ? t : null;
  });
  return res;   // null = 用 AEL_RIDE_MIN 估計
}

function trackAEL(){
  if(!selAEL) return;
  var air = (mtr.AIR||{}).times || [], tsy = (mtr.TSY||{}).times || [];
  var a = air.filter(function(t){ return Math.abs(t - selAEL.air) <= 3*60000; })[0];
  if(a!=null){
    selAEL.air = a;
    selAEL.tsy = tsyFor(a, air, tsy);
  }else{
    var ref = selAEL.tsy || selAEL.air + AEL_RIDE_MIN*60000;
    var m2 = tsy.filter(function(t){ return Math.abs(t - ref) <= 5*60000; })[0];
    if(m2!=null) selAEL.tsy = m2;
    if(Date.now() - ref > 25*60000) selAEL = null;
  }
  save('selAEL', selAEL);
}

/* ================= 更新 ================= */
function neededFor(tab){
  var codes = {}, needAel = false, need968 = false;
  tab.cards.forEach(function(c){
    if(c.kind==='ael'){ needAel = true; codes.TY928 = 1; }
    else codes[c.code] = 1;
    if(c.xfer==='968'){ need968 = true; XFER968.forEach(function(x){ codes[x.near] = 1; }); }
  });
  return { codes:Object.keys(codes), ael:needAel, r968:need968 && !!sel968 };
}

async function refresh(){
  if(refreshing){ again = true; return; }
  refreshing = true; again = false;
  document.getElementById('refresh').classList.add('spin');
  var tab = tabById(active);
  var need = neededFor(tab);
  var missing = need.codes.some(function(c){ return !KNOWN[c]; });
  if(missing || need.r968) await ensureStops();
  if(tab.id==='sephb') await ensure968Ctx();
  var needArr = selArr && tab.cards.some(function(c){ return c.arrive; });
  if(needArr){ await ensureStops(); await ensureArriveCtx(); }
  var jobs = need.codes.map(loadEta);
  if(need.ael){ jobs.push(loadMtr('AIR')); jobs.push(loadMtr('TSY')); }
  if(tab.id==='sephb' && sel968) jobs.push(load968Eta());
  if(needArr) jobs.push(loadArriveEta());
  await Promise.allSettled(jobs);
  if(need.ael) trackAEL();
  trackReminder();
  trackArrive();
  refreshing = false;
  document.getElementById('refresh').classList.remove('spin');
  render();
  if(again) refresh();
}

/* ================= 顯示 ================= */
function etaRowHtml(t, opts){

          (opts.tap ? ' role="button" tabindex="0" data-sel="' + opts.tap + '" data-t="' + t + '"' : '') +
          (opts.tap==='rem' || opts.tap==='arr' ? ' data-code="' + esc(opts.code) + '" data-route="' + esc(opts.route) + '"' : '') + '>';

       (opts.rmk ? '<span class="rmk">' + esc(opts.rmk) + '</span>' : '') +
       (opts.bell ? '<span class="bell">' + opts.bell + '</span>' : '') + '</div>';
  if(buf) h += slack < 0 ? '<div class="leave late">出門時間已過</div>'
             : '<div class="leave">' + hm(t - buf*60000) + ' 前出門 · <b class="' + colorFor(slack) + '">' +
               (slack <= 0 ? '而家就要出門' : '仲有 ' + slack + ' 分鐘要出門') + '</b></div>';

                 : '<div class="mins ' + colorFor(slack) + '">' + left + '<small>分鐘</small></div>';
  return h + '</div>';
}

// 九巴會回傳兩個方向嘅班次;只要往設定目的地嗰邊
function destMatch(dest, hint){
  var a = normDest(dest), b = normDest(hint);
  return !a || !b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}
function hintFor(code, route){
  var hint = '';
  TABS.forEach(function(tb){ tb.cards.forEach(function(c){
    if(c.code === code) c.routes.forEach(function(r){ if(r.r === route && !hint) hint = r.hint; });
  }); });
  return hint;
}

function groupsFor(card, st){
  var out = [];
  card.routes.forEach(function(r){
    var entries = st.data.filter(function(d){ return d.route === r.r && destMatch(d.dest_tc, r.hint); });
    if(!entries.length){ out.push({ route:r.r, dest:r.hint, times:[], remark:'' }); return; }
    var map = {}, order = [];
    entries.forEach(function(d){
      var k = (d.dir||'') + '|' + normDest(d.dest_tc);
      if(!map[k]){ map[k] = { route:r.r, dest:d.dest_tc, times:[], remark:'' }; order.push(k); }
      if(d.eta) map[k].times.push({ t:new Date(d.eta).getTime(), rmk:d.rmk_tc });
      else if(d.rmk_tc && !map[k].remark) map[k].remark = d.rmk_tc;
    });
    order.forEach(function(k){
      var g = map[k], seen = {};
      g.times = g.times.sort(function(a,b){ return a.t-b.t; })
        .filter(function(x){ if(seen[x.t]) return false; seen[x.t] = 1; return x.t > Date.now() - 60000; });
      out.push(g);
    });
  });
  return out;
}

function connList(code, routes, arrive){
  var st = eta[code];
  if(!st || !st.lastOk) return null;
  var list = [];
  st.data.forEach(function(d){
    if(routes.indexOf(d.route) >= 0 && d.eta && destMatch(d.dest_tc, hintFor(code, d.route))) list.push({ r:d.route, t:new Date(d.eta).getTime() });
  });
  var seen = {}, count = {}, perRoute = routes.length > 1 ? 2 : 3;   // 多條線時每條最多 2 班,唔會畀一條線霸晒
  return list.filter(function(c){ var k = c.r + c.t; if(seen[k]) return false; seen[k] = 1; return c.t >= arrive - 5*60000; })
    .sort(function(a,b){ return a.t-b.t; })
    .filter(function(c){ count[c.r] = (count[c.r]||0) + 1; return count[c.r] <= perRoute; });
}

function connHtml(list){
  if(list==null) return '<div class="xmsg">載入緊轉車班次...</div>';
  if(!list.length) return '<div class="xmsg">暫時未有之後嘅班次資料</div>';
  var ok = list.some(function(c){ return c.ok; });
  return list.map(function(c){
    return '<div class="conn"><span><span class="rno tag">' + esc(c.r) + '</span>' + hm(c.t) +
           (c.ok ? '<span class="wait">' + (c.wait < 1 ? '即到' : '等 ' + c.wait + ' 分鐘') + '</span>' : '') + '</span>' + c.status + '</div>';
  }).join('') + (ok ? '' : '<div class="xmsg">之後嘅班次仲未有資料</div>');
}
function withStatus(list, arrive){
  if(!list) return list;
  return list.map(function(c){
    var gap = (c.t - arrive)/60000;
    c.ok = gap >= 0;
    c.wait = Math.max(0, Math.round(gap));   // 到咗轉車站要等幾耐
    c.status = gap < 0 ? '<span class="red">❌ 趕唔切</span>'
             : gap <= TIGHT_MIN ? '<span class="orange">⚠️ 好趕</span>'
             : '<span class="green">✅ 夠時間</span>';
    return c;
  });
}

function panel968(){
  var h = '<div class="xfer">';
  var board = sel968.board || sel968.eta;   // 喺永吉街開出嘅時間
  XFER968.forEach(function(x){

    h += '<div class="xpt">';

    h += '<div class="xpt-h">' + x.name + '<span>968 約 ' + hm(arrive) + ' 到</span></div>';
    h += connHtml(withStatus(connList(x.near, x.routes, arrive), arrive)) + '</div>';
  });
  return h + '</div>';
}

function panelAEL(){
  var tsy = selAEL.tsy || selAEL.air + AEL_RIDE_MIN*60000;
  var arrive = tsy + AEL_WALK_MIN*60000;
  var h = '<div class="xfer"><div class="xpt"><div class="xpt-h">青衣<span class="walk">行路' + AEL_WALK_MIN + '分鐘<br>約 ' + hm(arrive) + ' 到巴士站</span></div>';
  h += connHtml(withStatus(connList('TY928', ['68E'], arrive), arrive));
  return h + '</div></div>';
}

// 有出門預留時間嘅站:撳一班車就設定出門提醒
function remRowHtml(card, route, x, showTag){
  var canCatch = minsTo(x.t) - card.buffer >= 0;
  var on = isReminder(card.code, route, x.t);
  var bell = !on ? '' : reminder.push==='on' ? '🔔 已設推送提醒' : reminder.push==='pending' ? '🔔 設定緊...'
           : reminder.push==='off' ? '🔔 已設提醒(要開住網頁)' : '🔔 已設提醒';
  return etaRowHtml(x.t, { buffer:card.buffer, rmk:x.rmk, tap:(canCatch || on) ? 'rem' : '', code:card.code, route:route, open:on, bell:bell, tag:showTag ? route : '' });
}
function isReminder(code, route, t){
  return !!reminder && reminder.code===code && reminder.route===route && Math.abs(reminder.t - t) <= 90000;
}

// 同一個站有以下路線組合時,合埋一個列表,按時間排
var MERGE_SETS = [['68E','68F'], ['E36','E36S']];
function applyMerge(card, groups){
  MERGE_SETS.forEach(function(set){
    var hit = card.routes.filter(function(r){ return set.indexOf(r.r) >= 0; });
    if(hit.length < 2) return;
    var at = -1, parts = [];
    groups = groups.filter(function(g, i){
      if(g.merged || set.indexOf(g.route) < 0) return true;
      if(at < 0) at = i;
      parts.push(g); return false;
    });
    if(parts.length) groups.splice(Math.min(at, groups.length), 0, mergeGroups(parts));
  });
  return groups;
}
function mergeGroups(groups){
  var times = [], seen = {}, remark = '';
  groups.forEach(function(g){
    if(!remark && g.remark) remark = g.route + ' ' + g.remark;
    g.times.forEach(function(x){
      var k = g.route + '|' + x.t; if(seen[k]) return; seen[k] = 1;
      times.push({ t:x.t, rmk:x.rmk, route:g.route });
    });
  });
  times.sort(function(a,b){ return a.t-b.t; });
  return { merged:true, heads:groups, times:times, remark:remark };
}

function kmbCard(card){
  var st = eta[card.code] || { data:[] };
  var stale = st.lastOk && (st.error || Date.now() - st.lastOk > STALE_MS);
  var h = '<section class="stop' + (stale ? ' stale' : '') + '"><div class="stop-h"><div><div class="stop-name">' + esc(card.name) + '</div>' +
          '<div class="stop-code">' + esc(card.code) + '</div></div>' +
          (card.buffer ? '<span class="buffer">預 ' + card.buffer + ' 分鐘出門</span>' : '') + '</div>';
  if(st.noId) return h + '<div class="err">搵唔到呢個站，請檢查站牌編號</div></section>';
  if(st.error && !st.lastOk) return h + '<div class="err">⚠️ 無法載入數據，請檢查網絡後重新整理</div></section>';
  if(stale) h += '<div class="warn">⚠️ 更新失敗，以下係 ' + new Date(st.lastOk).toLocaleTimeString('en-GB') + ' 嘅舊資料</div>';
  var groups = groupsFor(card, st);
  groups = applyMerge(card, groups);
  groups.forEach(function(g){
    var heads = g.merged ? g.heads : [g];
    var oneDest = heads.every(function(x){ return String(x.dest||'').replace(/\s/g,'') === String(heads[0].dest||'').replace(/\s/g,''); });   // 目的地一樣就只寫一次
    h += '<div class="route"><div class="route-h">' + heads.map(function(x, i){
           var showDest = x.dest && (!oneDest || i === heads.length - 1);
           return '<span class="rno">' + esc(x.route) + '</span>' + (showDest ? '<span class="dest">往 ' + esc(x.dest) + '</span>' : '');
         }).join('') + '</div>';
    var canTap = card.xfer==='968' && g.route==='968';
    var matched = false;
    var selT = sel968 && (sel968.board || sel968.eta);
    if(canTap && sel968 && !g.times.some(function(x){ return Math.abs(x.t - selT) <= 90000; })){
      h += '<div class="sel-head"><span>已揀 ' + hm(sel968.board || sel968.eta) + ' 開出嗰班</span><button class="x-btn" data-clear="968" aria-label="取消">✕</button></div>' + panel968();
      matched = true;
    }
    if(!g.times.length){
      h += g.remark ? '<div class="none rmk-only">' + esc(g.remark) + '</div>'
                    : '<div class="none">' + (st.lastOk ? '暫無班次資料' : '載入中...') + '</div>';
    }
    g.times.slice(0, g.merged ? 5 : 3).forEach(function(x){
      var open = canTap && sel968 && !matched && Math.abs(x.t - selT) <= 90000;
      if(card.arrive && (x.route || g.route)===ARRIVE.route){
        var on = !!selArr && selArr.code===card.code && Math.abs(x.t - selArr.t) <= 90000;
        h += etaRowHtml(x.t, { rmk:x.rmk, tap:'arr', code:card.code, route:ARRIVE.route, open:on });
        if(on) h += panelArrive(card.code, x.t);
        return;
      }
      if(!canTap && card.buffer){ h += remRowHtml(card, x.route || g.route, x, g.merged); return; }
      h += etaRowHtml(x.t, { buffer:card.buffer, rmk:x.rmk, tap:canTap ? '968' : '', open:open, tag:g.merged ? x.route : '' });
      if(open){ matched = true; h += panel968(); }
    });
    h += '</div>';
  });
  if(st.lastOk && !stale) h += '<div class="upd">更新於 ' + new Date(st.lastOk).toLocaleTimeString('en-GB') + '</div>';
  return h + '</section>';
}

function aelCard(card){
  var st = mtr.AIR || { times:[] };
  var stale = st.lastOk && (st.error || Date.now() - st.lastOk > STALE_MS);
  var h = '<section class="stop' + (stale ? ' stale' : '') + '"><div class="stop-h"><div><div class="stop-name">' + esc(card.name) + '</div>' +
          '<div class="stop-code">' + esc(card.sub) + '</div></div></div>';
  if(st.error && !st.lastOk) return h + '<div class="err">⚠️ 無法載入港鐵數據，請檢查網絡後重新整理</div></section>';
  if(stale) h += '<div class="warn">⚠️ 更新失敗，以下係 ' + new Date(st.lastOk).toLocaleTimeString('en-GB') + ' 嘅舊資料</div>';
  h += '<div class="route"><div class="route-h"><span class="rno">機場快綫</span><span class="dest">往 青衣／香港</span></div>';
  var times = st.times.filter(function(t){ return t > Date.now() - 60000; });
  var matched = false;
  if(selAEL && !times.some(function(t){ return Math.abs(t - selAEL.air) <= 90000; })){
    h += '<div class="sel-head"><span>已揀 ' + hm(selAEL.air) + ' 開出嗰班</span><button class="x-btn" data-clear="ael" aria-label="取消">✕</button></div>' + panelAEL();
    matched = true;
  }
  if(!times.length) h += '<div class="none">' + (st.lastOk ? '暫無班次資料' : '載入中...') + '</div>';
  times.slice(0,3).forEach(function(t){
    var open = selAEL && !matched && Math.abs(t - selAEL.air) <= 90000;
    h += etaRowHtml(t, { verb:'開出', tap:'ael', open:open });
    if(open){ matched = true; h += panelAEL(); }
  });
  h += '</div>';
  if(st.lastOk && !stale) h += '<div class="upd">更新於 ' + new Date(st.lastOk).toLocaleTimeString('en-GB') + '</div>';
  return h + '</section>';
}

function render(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab" role="tab" aria-selected="' + (t.id===active) + '" data-tab="' + t.id + '">' +
           '<span class="e">' + t.e + '</span>' + t.name + '</button>';
  }).join('');
  var alarm = reminder && reminder.fired
    ? '<div class="alarm"><span>🔔 夠鐘出門！' + esc(reminder.route) + ' ' + hm(reminder.t) + ' 到站</span><button class="x-btn" data-clear="rem">知道</button></div>' : '';
  var demo = DEMO ? '<div class="demo"><span>🧪 預覽模式：班次係模擬資料</span><button data-demo="off">返回正常版</button></div>' : '';
  if(active==='seph') alarm += shiftHtml();
  if(shiftAlarm && shiftAlarm.fired)
    alarm = '<div class="alarm"><span>⏰ 夠鐘出門返工！' + esc(shiftAlarm.id) + ' 更 ' + esc(shiftAlarm.start) + '</span><button class="x-btn" data-clear="shift">知道</button></div>' + alarm;
  document.getElementById('content').innerHTML = demo + alarm + tabById(active).cards.map(function(c){
    return c.kind==='ael' ? aelCard(c) : kmbCard(c);
  }).join('') + (shiftPicker ? pickerHtml() : '');
}

/* ================= 操作 ================= */
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b || b.dataset.tab===active) return;
  active = b.dataset.tab; save('tab', active); render(); refresh();
});

function onContent(e){
  if(e.type==='click'){
    var sp = e.target.closest('[data-shift]');
    if(sp){ shiftPicker = sp.dataset.shift==='open'; render(); return; }
    var pick = e.target.closest('[data-shift-pick]');
    if(pick){ setShift(pick.dataset.shiftPick); return; }
    if(shiftPicker && e.target.classList.contains('sheet-bg')){ shiftPicker = false; render(); return; }
  }
  if(e.type==='click' && e.target.closest('[data-demo]')){ setDemo(false); return; }
  var x = e.target.closest('.x-btn');
  if(x && e.type==='click'){
    if(x.dataset.clear==='968'){ sel968 = null; save('sel968', null); }
    else if(x.dataset.clear==='rem'){ clearReminder(); }
    else if(x.dataset.clear==='shift'){ clearShift(); }
    else { selAEL = null; save('selAEL', null); }
    render(); return;
  }
  var row = e.target.closest('.eta-row.tap'); if(!row) return;
  if(e.type==='keydown' && e.key!=='Enter' && e.key!==' ') return;
  e.preventDefault();
  var t = +row.dataset.t;
  if(row.dataset.sel==='rem'){
    var code = row.dataset.code, route = row.dataset.route;
    if(isReminder(code, route, t)){ clearReminder(); render(); return; }
    var card = null;
    TABS.forEach(function(tb){ tb.cards.forEach(function(c){ if(c.code===code && c.buffer) card = c; }); });
    clearReminder();
    reminder = { code:code, route:route, t:t, buf:card ? card.buffer : 0, name:card ? card.name : '', fired:false, push:PUSH_API ? 'pending' : '' };
    save('reminder', reminder);
    if(PUSH_API) setupPush(reminder);
    else try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(err){}
    render(); return;
  }
  if(row.dataset.sel==='arr'){
    var on = selArr && selArr.code===row.dataset.code && Math.abs(t - selArr.t) <= 90000;
    selArr = on ? null : { code:row.dataset.code, t:t };
    save('selArr', selArr); render(); if(selArr) refresh(); return;
  }
  if(row.dataset.sel==='968'){
    if(sel968 && Math.abs(t - (sel968.board||sel968.eta)) <= 90000){ sel968 = null; save('sel968', null); render(); return; }
    sel968 = { seq:(r968.ctx ? r968.ctx.boardSeq : 0), eta:t, board:t };
    save('sel968', sel968); render(); refresh();
  }else{
    if(selAEL && Math.abs(t - selAEL.air) <= 90000){ selAEL = null; save('selAEL', null); render(); return; }
    selAEL = { air:t, tsy:null }; trackAEL(); render();
  }
}
document.getElementById('content').addEventListener('click', onContent);
document.getElementById('content').addEventListener('keydown', onContent);
document.getElementById('refresh').addEventListener('click', refresh);

(function pullToRefresh(){
  var ptr = document.getElementById('ptr'), startY = null, dist = 0, TH = 35, MAX = 90;
  window.addEventListener('touchstart', function(e){ startY = (window.scrollY<=0 && e.touches.length===1) ? e.touches[0].clientY : null; dist = 0; }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if(startY===null) return;
    if(window.scrollY > 0){ startY = null; ptr.style.height = '0'; return; }
    dist = Math.max(0, Math.min(MAX, (e.touches[0].clientY - startY)*0.5));
    ptr.style.height = dist + 'px'; ptr.textContent = dist >= TH ? '放手即更新' : '下拉更新';
  }, {passive:true});
  window.addEventListener('touchend', function(){
    if(startY!==null && dist >= TH) refresh();
    startY = null; dist = 0; ptr.style.height = '0'; ptr.textContent = '';
  }, {passive:true});
})();

/* ================= 排程(切走 app 就暫停) ================= */
function tick(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); checkReminder(); checkShift(); }

/* ================= 返工更出門提示 ================= */
function shiftNotifyAt(start){
  var p = start.split(':'), d = new Date();
  d.setHours(+p[0], +p[1] - SHIFT_EARLY - SHIFT_TRAVEL, 0, 0);
  if(d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);   // 今日已過就設聽日
  return d.getTime();
}
function dayLabel(t){
  var a = new Date(t), b = new Date();
  return a.toDateString() === b.toDateString() ? '今日' : '聽日';
}
function shiftHtml(){
  if(!shiftAlarm || shiftAlarm.fired) return '<button class="shift-btn" data-shift="open">⏰ 出門提示：揀返工更</button>';
  var how = shiftAlarm.push==='on' ? '推送提醒' : shiftAlarm.push==='pending' ? '設定緊...' : shiftAlarm.push==='off' ? '要開住網頁先會提' : '';
  return '<div class="shift-on"><span class="txt">⏰ <b>' + esc(shiftAlarm.id) + ' 更</b> 返 ' + esc(shiftAlarm.start) +
         '<span class="sub">' + dayLabel(shiftAlarm.at) + ' ' + hm(shiftAlarm.at) + ' 提你出門' + (how ? ' · ' + how : '') + '</span></span>' +
         '<button data-shift="open">更改</button><button class="x-btn" data-clear="shift" aria-label="取消">✕</button></div>';
}
function pickerHtml(){
  return '<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="揀返工更"><h2>揀返工更</h2>' +
    '<p>早 ' + SHIFT_EARLY + ' 分鐘到，預 1 小時 ' + (SHIFT_TRAVEL - 60) + ' 分鐘車程(連行去巴士站)</p>' +
    SHIFTS.map(function(s){
      var at = shiftNotifyAt(s.start);
      return '<button class="shift-opt" data-shift-pick="' + s.id + '"><b>' + s.id + '</b><span class="when">返 ' + s.start + '</span>' +
             '<span class="ntf">' + dayLabel(at) + ' ' + hm(at) + ' 提你</span></button>';
    }).join('') + '<button class="cancel" data-shift="close">取消</button></div></div>';
}
function setShift(id){
  var s = SHIFTS.filter(function(x){ return x.id===id; })[0]; if(!s) return;
  clearShift();
  shiftAlarm = { id:s.id, start:s.start, at:shiftNotifyAt(s.start), fired:false, push:PUSH_API ? 'pending' : '' };
  save('shiftAlarm', shiftAlarm); shiftPicker = false;
  if(PUSH_API) setupShiftPush(shiftAlarm);
  else try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(err){}
  render();
}
async function setupShiftPush(a){
  try{
    var sid = await pushRegister({ kind:'alarm', at:a.at, title:'夠鐘出門返工！', body:a.id + ' 更 ' + a.start + ' 返工' });
    if(shiftAlarm !== a){ cancelPush(sid); return; }
    a.serverId = sid; a.push = 'on';
  }catch(e){ if(shiftAlarm === a) a.push = 'off'; }
  if(shiftAlarm === a){ save('shiftAlarm', a); render(); }
}
function clearShift(){
  if(shiftAlarm && !shiftAlarm.fired) cancelPush(shiftAlarm.serverId);
  shiftAlarm = null; save('shiftAlarm', null);
}
function checkShift(){
  if(!shiftAlarm) return;
  if(shiftAlarm.fired){ if(Date.now() > shiftAlarm.at + 3*3600e3){ shiftAlarm = null; save('shiftAlarm', null); render(); } return; }
  if(Date.now() < shiftAlarm.at) return;
  shiftAlarm.fired = true; save('shiftAlarm', shiftAlarm);
  var body = shiftAlarm.id + ' 更 ' + shiftAlarm.start + ' 返工';
  try{
    if(shiftAlarm.push!=='on' && 'Notification' in window && Notification.permission==='granted'){
      if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(function(r){ r.showNotification('夠鐘出門返工！', { body:body, icon:'BUS.jpg' }); });
      else new Notification('夠鐘出門返工！', { body:body, icon:'BUS.jpg' });
    }
  }catch(err){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch(err){}
  render();
}

/* ================= 出門提醒 ================= */
// 有 PUSH_API:交畀推送伺服器,鎖咗機都會收到;冇嘅話要開住網頁先會響
var vapidPub = null;
function b64uBytes(s){
  var bin = atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4));
  var out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function sameKey(sub, key){
  var k = sub.options && sub.options.applicationServerKey;
  if(!k) return false;
  var a = new Uint8Array(k), b = b64uBytes(key);
  return a.length===b.length && a.every(function(x,i){ return x===b[i]; });
}
var pushInfo = null;   // 伺服器設定:{publicKey, bark}
function loadPushInfo(){
  if(!PUSH_API || pushInfo) return Promise.resolve(pushInfo);
  return fetchJson(PUSH_API + '/vapid').then(function(j){ pushInfo = j; return j; }).catch(function(){ return null; });
}
// 將提醒交畀推送伺服器,成功就回傳伺服器 id。用 Bark 唔使瀏覽器通知權限
async function pushRegister(payload){
  if(!pushInfo) await loadPushInfo();
  if(!(pushInfo && pushInfo.bark)){
    var perm = null;
    try{ perm = Notification.requestPermission(); }catch(e){}   // 盡量喺撳嘅時候即刻問
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('unsupported');
    if(!perm || (await perm) !== 'granted') throw new Error('denied');
    var reg = await Promise.race([navigator.serviceWorker.ready, sleep(5000).then(function(){ throw new Error('sw timeout'); })]);
    if(!vapidPub) vapidPub = (pushInfo || await fetchJson(PUSH_API + '/vapid')).publicKey;
    var sub = await reg.pushManager.getSubscription();
    if(sub && !sameKey(sub, vapidPub)){ await sub.unsubscribe(); sub = null; }
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64uBytes(vapidPub) });
    payload.subscription = sub.toJSON();
  }
  var res = await fetch(PUSH_API + '/reminders', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload) });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).id;
}
async function setupPush(r){
  try{
    var id = stopId(r.code); if(!id) throw new Error('no stop id');
    var sid = await pushRegister({ stopId:id, route:r.route, t:r.t, buf:r.buf, stop:r.name });
    if(reminder !== r){ cancelPush(sid); return; }   // 設定期間已經取消或者換咗
    r.serverId = sid; r.push = 'on';
  }catch(e){ if(reminder === r) r.push = 'off'; }
  if(reminder === r){ save('reminder', r); render(); }
}
function cancelPush(id){
  if(!PUSH_API || !id) return;
  try{ fetch(PUSH_API + '/reminders/' + id, { method:'DELETE' }).catch(function(){}); }catch(e){}
}
function clearReminder(){
  if(reminder && !reminder.fired) cancelPush(reminder.serverId);
  reminder = null; save('reminder', null);
}
function trackReminder(){
  if(!reminder) return;
  var st = eta[reminder.code];
  if(st && st.lastOk){
    var near = st.data.filter(function(d){ return d.route===reminder.route && d.eta; })
      .map(function(d){ return new Date(d.eta).getTime(); })
      .filter(function(t){ return Math.abs(t - reminder.t) <= 4*60000; })
      .sort(function(a,b){ return Math.abs(a-reminder.t) - Math.abs(b-reminder.t); })[0];
    if(near!=null) reminder.t = near;
  }
  if(Date.now() > reminder.t + 2*60000) reminder = null;
  save('reminder', reminder);
}
function checkReminder(){
  if(!reminder || reminder.fired) return;
  if(Date.now() > reminder.t + 2*60000){ reminder = null; save('reminder', null); render(); return; }
  if(Date.now() < reminder.t - reminder.buf*60000) return;
  reminder.fired = true; save('reminder', reminder);
  var body = reminder.route + ' ' + hm(reminder.t) + ' 到站';
  try{
    if(reminder.push!=='on' && 'Notification' in window && Notification.permission==='granted'){
      if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(function(r){ r.showNotification('夠鐘出門！', { body:body, icon:'BUS.jpg' }); });
      else new Notification('夠鐘出門！', { body:body, icon:'BUS.jpg' });
    }
  }catch(err){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch(err){}
  render();
}
function startTimers(){
  stopTimers(); tick();
  timers.clock = setInterval(tick, 1000);
  timers.render = setInterval(render, 10000);
  timers.refresh = setInterval(refresh, REFRESH_MS);
}
function stopTimers(){ clearInterval(timers.clock); clearInterval(timers.render); clearInterval(timers.refresh); }
document.addEventListener('visibilitychange', function(){
  if(document.hidden) stopTimers(); else { render(); refresh(); startTimers(); }
});
window.addEventListener('online', refresh);
window.addEventListener('pageshow', function(e){ if(e.persisted){ render(); refresh(); } });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
loadPushInfo();
if(!TABS.some(function(t){ return t.id===active; })) active = 'out';
document.getElementById('ver').textContent = VERSION + (DEMO ? ' · 預覽模式' : '');
document.getElementById('ver').addEventListener('click', function(){
  if(DEMO) setDemo(false);
  else if(confirm('開啟預覽模式？\n會用模擬班次,方便測試出門提醒。')) setDemo(true);
});
render(); refresh(); startTimers();
})();
</script>
