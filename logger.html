<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#34599a" />
<title>記錄器狀態</title>
<link rel="apple-touch-icon" href="BUS.jpg" />
<link rel="icon" href="BUS.jpg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="記錄器" />
<style>
  :root{
    --bg:#e6ebf4; --card:#ffffff; --line:#e5e5ea;
    --text:#3a3a3c; --sub:#6e6e73; --dim:#8e8e93;
    --accent:#34599a; --accent-soft:#e3eaf5;
    --red:#d70015; --orange:#c93400; --green:#248a3d;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(52,89,154,.25)}
  .wrap{max-width:32rem;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:20px;font-weight:700}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:17px;cursor:pointer}
  .icon-btn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{padding:16px 16px 0}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(52,89,154,.08)}
  .big{display:flex;align-items:center;gap:12px}
  .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .dot.ok{background:var(--green);box-shadow:0 0 0 6px rgba(36,138,61,.15)}
  .dot.warn{background:var(--orange);box-shadow:0 0 0 6px rgba(201,52,0,.15)}
  .dot.bad{background:var(--red);box-shadow:0 0 0 6px rgba(215,0,21,.15)}
  .state{font-size:20px;font-weight:700}
  .state-sub{font-size:13px;color:var(--sub);margin-top:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
  .stat span{font-size:12px;color:var(--sub)}
  .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .k{color:var(--sub)}
  .ok-t{color:var(--green)} .warn-t{color:var(--orange)} .bad-t{color:var(--red)}
  h2{margin:0 0 10px;font-size:17px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .seg button{border:0;border-radius:10px;padding:8px 4px;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .stop-name{font-size:16px;font-weight:700;margin:12px 0 6px}
  .stop-name:first-of-type{margin-top:0}
  .route{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
  .rno{border:1.5px solid var(--accent);color:var(--accent);border-radius:7px;padding:1px 7px;font-weight:700;font-size:14px}
  .dest{font-size:13px;color:var(--sub)}
  .times{width:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .t{font-size:14px;font-variant-numeric:tabular-nums;background:var(--accent-soft);border-radius:8px;padding:3px 8px}
  .none{font-size:13px;color:var(--dim);width:100%}
  button.t{border:0;font:inherit;font-size:14px;color:var(--text);cursor:pointer}
  button.t[aria-expanded="true"]{background:var(--accent);color:#fff}
  .hist{width:100%;background:#f4f6fb;border:1px solid var(--accent-soft);border-radius:12px;padding:8px 12px;margin-top:6px}
  .hist-h{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px}
  .hist .r{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
  .hist .r:first-of-type{border-top:0}
  .hist .miss{color:var(--dim)}
  .btn{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:12px;cursor:pointer}
  .btn:disabled{opacity:.6}
  .msg{font-size:13px;color:var(--sub);margin-top:8px;min-height:18px}
  .err{font-size:13px;color:var(--red);background:#fdecee;padding:9px 11px;border-radius:10px;margin-bottom:14px}
  .foot{text-align:center;font-size:12px;color:var(--dim);padding-top:4px}
  .foot a{color:var(--accent)}
  button:focus-visible{outline:2px solid #ffb000;outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <h1>記錄器狀態</h1>
    <button class="icon-btn" id="refresh" aria-label="重新整理">↻</button>
  </div>
</header>
<main class="wrap">
  <div id="error"></div>
  <section class="card">
    <div class="big"><span class="dot" id="dot"></span>
      <div><div class="state" id="state">載入中...</div><div class="state-sub" id="stateSub"></div></div>
    </div>
    <div class="grid">
      <div class="stat"><b id="arrivals">–</b><span>已記錄到站</span></div>
      <div class="stat"><b id="days">–</b><span>記錄咗幾多日</span></div>
    </div>
  </section>

  <section class="card" id="details"></section>

  <section class="card">
    <h2>估計班次</h2>
    <div class="seg" id="seg">
      <button data-day="W">平日</button><button data-day="S">星期六</button><button data-day="H">星期日</button>
    </div>
    <div id="predict"></div>
  </section>

  <section class="card">
    <button class="btn" id="run">立即記錄一次</button>
    <div class="msg" id="runMsg">平時唔使撳，佢每 3 分鐘會自動行。</div>
  </section>

  <div class="foot">每 30 秒自動更新 · <a href="./">返九巴到站</a></div>
</main>

<script>
(function(){
'use strict';
var API = 'https://buseta.adrian5289.workers.dev';
var CRON_MIN = 3;   // Cloudflare 每 3 分鐘行一次
var STOPS = [
  { code:'YL292', name:'馬田壆', routes:['68E','68F'] },
  { code:'YL255', name:'康樂路', routes:['E36','E36S','A36'] }
];
var HK = 8 * 3600e3;
var day = (function(){ var d = new Date(Date.now() + HK + 864e5).getUTCDay(); return d===0 ? 'H' : d===6 ? 'S' : 'W'; })();   // 預設睇聽日
var last = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function hm(ms){ return new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function ago(ms){
  var s = Math.max(0, Math.round((Date.now() - ms)/1000));
  if(s < 60) return s + ' 秒前';
  var m = Math.round(s/60);
  return m < 60 ? m + ' 分鐘前' : Math.floor(m/60) + ' 小時 ' + (m%60) + ' 分鐘前';
}
async function getJson(path){
  var res = await fetch(API + path, { cache:'no-store' });
  var j = await res.json().catch(function(){ return null; });
  if(!res.ok) throw new Error((j && j.error) || ('HTTP ' + res.status));
  return j;
}

function showStatus(s, home){
  last = s;
  var run = s.lastRun, mins = run ? (Date.now() - run.ts) / 60000 : Infinity;
  var level = !run ? 'bad' : mins <= CRON_MIN * 2 ? 'ok' : mins <= CRON_MIN * 5 ? 'warn' : 'bad';
  $('dot').className = 'dot ' + level;
  $('state').textContent = level==='ok' ? '✅ 自動記錄緊' : level==='warn' ? '⚠️ 遲咗少少' : '❌ 冇自動行緊';
  $('stateSub').textContent = run ? '最後一次：' + ago(run.ts) + '（' + hm(run.ts) + '）' : '仲未行過';
  $('arrivals').textContent = s.arrivals;
  $('days').textContent = s.days;

  var failed = run && run.failed && run.failed.length ? run.failed : [];
  var isNew = home && JSON.stringify(home.try || []).indexOf('YL255') >= 0;
  var rows = [
    ['自動定時', level==='ok' ? '<span class="ok-t">正常（每 ' + CRON_MIN + ' 分鐘）</span>'
               : level==='warn' ? '<span class="warn-t">超過 ' + Math.round(mins) + ' 分鐘冇行</span>'
               : '<span class="bad-t">檢查 Cron Triggers</span>'],
    ['上次記錄到站', run ? run.recorded + ' 班' : '–'],
    ['九巴查詢', failed.length ? '<span class="bad-t">失敗：' + esc(failed.join('、')) + '</span>' : '<span class="ok-t">正常</span>'],
    ['程式版本', home ? (isNew ? '<span class="ok-t">新版（只記錄 2 個站）</span>' : '<span class="warn-t">舊版，要重新貼上</span>') : '–']
  ];
  $('details').innerHTML = '<h2>詳細</h2>' + rows.map(function(r){
    return '<div class="row"><span class="k">' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join('');
}

function showPredict(results){
  lastResults = results;
  $('predict').innerHTML = STOPS.map(function(s, i){
    var out = results[i];
    return '<div class="stop-name">' + s.name + ' <span class="dest">' + s.code + '</span></div>' + s.routes.map(function(r){
      var p = out && out.routes && out.routes[r];
      var times = p && p.slots && p.slots.length
        ? p.slots.map(function(x, j){
            var key = s.code + '|' + r + '|' + j, on = openKey === key;
            return '<button class="t" data-key="' + key + '" aria-expanded="' + on + '">' + x.t + '</button>' + (on ? histHtml(p, x) : '');
          }).join('')
        : '<span class="none">' + (p ? '資料未夠（用咗 ' + p.days + ' 日記錄）' : '載入失敗') + '</span>';
      return '<div class="route"><span class="rno">' + r + '</span>' + (p && p.dest ? '<span class="dest">往 ' + esc(p.dest) + '</span>' : '') +
             '<div class="times">' + times + '</div></div>';
    }).join('');
  }).join('');
}

// 撳一班:睇返過去幾日每日實際幾點到
var WEEK = ['日','一','二','三','四','五','六'];
function histHtml(p, x){
  var dates = (p.dates || []).slice().sort().reverse();
  return '<div class="hist"><div class="hist-h">' + x.t + ' 呢班：最近 ' + dates.length + ' 日（' + x.n + ' 日有記錄）</div>' +
    dates.map(function(d){
      var w = WEEK[new Date(d + 'T00:00:00Z').getUTCDay()], t = x.seen && x.seen[d];
      return '<div class="r"><span>' + d.slice(5).replace('-', '/') + '（' + w + '）</span>' +
             (t ? '<span>' + t + '</span>' : '<span class="miss">冇記錄</span>') + '</div>';
    }).join('') + '</div>';
}
var openKey = null, lastResults = [];

function markDay(){
  Array.prototype.forEach.call($('seg').children, function(b){ b.setAttribute('aria-pressed', String(b.dataset.day===day)); });
}

async function load(){
  $('refresh').classList.add('spin');
  $('error').innerHTML = '';
  try{
    var r = await Promise.all([getJson('/status'), getJson('/').catch(function(){ return null; })]);
    showStatus(r[0], r[1]);
  }catch(e){
    $('dot').className = 'dot bad'; $('state').textContent = '❌ 連唔到記錄器';
    $('stateSub').textContent = ''; $('details').innerHTML = '';
    $('error').innerHTML = '<div class="err">⚠️ ' + esc(e.message) + '</div>';
  }
  await loadPredict();
  $('refresh').classList.remove('spin');
}
async function loadPredict(){
  markDay();
  var results = await Promise.all(STOPS.map(function(s){
    return getJson('/predict?stop=' + s.code + '&route=' + s.routes.join(',') + '&day=' + day).catch(function(){ return null; });
  }));
  showPredict(results);
}

$('refresh').addEventListener('click', load);
$('predict').addEventListener('click', function(e){
  var b = e.target.closest('button.t'); if(!b) return;
  openKey = openKey === b.dataset.key ? null : b.dataset.key;
  showPredict(lastResults);
});
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  day = b.dataset.day; openKey = null; loadPredict();
});
$('run').addEventListener('click', async function(){
  var btn = $('run'); btn.disabled = true; $('runMsg').textContent = '記錄緊...';
  try{
    var j = await getJson('/run');
    $('runMsg').textContent = '✅ 完成，今次記錄咗 ' + j.recorded + ' 班到站';
    load();
  }catch(e){ $('runMsg').textContent = '⚠️ 失敗：' + e.message; }
  btn.disabled = false;
});
// 「幾耐之前」每秒更新;資料每 30 秒重新攞
setInterval(function(){ if(last && last.lastRun) $('stateSub').textContent = '最後一次：' + ago(last.lastRun.ts) + '（' + hm(last.lastRun.ts) + '）'; }, 1000);
setInterval(function(){ if(!document.hidden) load(); }, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
load();
})();
</script>
</body>
</html>
